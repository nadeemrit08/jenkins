<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">
  <rect width="1180" height="760" fill="#f7f8fb"/>
  <style>
    .table{fill:#fff;stroke:#1f2937;stroke-width:2;rx:8}
    .head{fill:#243b53}
    .title{font:700 18px Arial,sans-serif;fill:#fff}
    .field{font:14px Arial,sans-serif;fill:#111827}
    .key{font:700 14px Arial,sans-serif;fill:#0f766e}
    .rel{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    .label{font:13px Arial,sans-serif;fill:#475569}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="40" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#111827">JDBC E-Commerce Database Design</text>

  <g transform="translate(60,90)">
    <rect class="table" width="270" height="210"/>
    <rect class="head" width="270" height="46"/>
    <text class="title" x="18" y="30">customers</text>
    <text class="key" x="18" y="76">PK id BIGINT</text>
    <text class="field" x="18" y="104">name VARCHAR(120)</text>
    <text class="field" x="18" y="132">email VARCHAR(180) UNIQUE</text>
    <text class="field" x="18" y="160">phone VARCHAR(30)</text>
    <text class="field" x="18" y="188">created_at TIMESTAMP</text>
  </g>

  <g transform="translate(850,90)">
    <rect class="table" width="270" height="230"/>
    <rect class="head" width="270" height="46"/>
    <text class="title" x="18" y="30">products</text>
    <text class="key" x="18" y="76">PK id BIGINT</text>
    <text class="field" x="18" y="104">name VARCHAR(160)</text>
    <text class="field" x="18" y="132">description VARCHAR(500)</text>
    <text class="field" x="18" y="160">price DECIMAL(10,2)</text>
    <text class="field" x="18" y="188">stock_quantity INT</text>
    <text class="field" x="18" y="216">created_at TIMESTAMP</text>
  </g>

  <g transform="translate(455,80)">
    <rect class="table" width="270" height="230"/>
    <rect class="head" width="270" height="46"/>
    <text class="title" x="18" y="30">cart</text>
    <text class="key" x="18" y="76">PK id BIGINT</text>
    <text class="field" x="18" y="104">FK customer_id BIGINT</text>
    <text class="field" x="18" y="132">FK product_id BIGINT</text>
    <text class="field" x="18" y="160">quantity INT</text>
    <text class="field" x="18" y="188">added_at TIMESTAMP</text>
    <text class="field" x="18" y="216">UNIQUE(customer_id, product_id)</text>
  </g>

  <g transform="translate(455,430)">
    <rect class="table" width="270" height="210"/>
    <rect class="head" width="270" height="46"/>
    <text class="title" x="18" y="30">orders</text>
    <text class="key" x="18" y="76">PK id BIGINT</text>
    <text class="field" x="18" y="104">FK customer_id BIGINT</text>
    <text class="field" x="18" y="132">total_amount DECIMAL(10,2)</text>
    <text class="field" x="18" y="160">status VARCHAR(30)</text>
    <text class="field" x="18" y="188">ordered_at TIMESTAMP</text>
  </g>

  <g transform="translate(850,420)">
    <rect class="table" width="270" height="250"/>
    <rect class="head" width="270" height="46"/>
    <text class="title" x="18" y="30">order_items</text>
    <text class="key" x="18" y="76">PK id BIGINT</text>
    <text class="field" x="18" y="104">FK order_id BIGINT</text>
    <text class="field" x="18" y="132">FK product_id BIGINT</text>
    <text class="field" x="18" y="160">quantity INT</text>
    <text class="field" x="18" y="188">unit_price DECIMAL(10,2)</text>
    <text class="field" x="18" y="216">line_total GENERATED</text>
  </g>

  <g transform="translate(60,350)">
    <rect class="table" width="270" height="240"/>
    <rect class="head" width="270" height="46"/>
    <text class="title" x="18" y="30">users</text>
    <text class="key" x="18" y="76">PK id BIGINT</text>
    <text class="field" x="18" y="104">username VARCHAR(80) UNIQUE</text>
    <text class="field" x="18" y="132">password_hash VARCHAR(255)</text>
    <text class="field" x="18" y="160">role ADMIN/CUSTOMER</text>
    <text class="field" x="18" y="188">FK customer_id BIGINT NULL</text>
    <text class="field" x="18" y="216">active BOOLEAN</text>
  </g>

  <path class="rel" d="M195 300 C195 325 195 330 195 350"/>
  <text class="label" x="205" y="326">customer login</text>
  <path class="rel" d="M330 185 C380 185 405 185 455 185"/>
  <text class="label" x="360" y="170">1 customer has cart rows</text>
  <path class="rel" d="M850 195 C800 195 775 195 725 195"/>
  <text class="label" x="746" y="180">1 product in cart</text>
  <path class="rel" d="M195 300 C195 525 305 535 455 535"/>
  <text class="label" x="225" y="514">1 customer places orders</text>
  <path class="rel" d="M725 535 C775 535 800 535 850 535"/>
  <text class="label" x="748" y="520">1 order has many items</text>
  <path class="rel" d="M985 320 C985 360 985 380 985 420"/>
  <text class="label" x="997" y="376">product purchased</text>
</svg>
